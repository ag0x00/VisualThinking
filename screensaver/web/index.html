<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Samarkand</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* two stacked full-bleed layers; the dissolve is a pure opacity crossfade */
    .layer { position: absolute; inset: 0; opacity: 0; transition: opacity var(--fade, 6000ms) ease-in-out; }
    .layer svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="a" class="layer"></div>
  <div id="b" class="layer"></div>
  <script type="module" src="/dist/main.js"></script>
</body>
</html>
